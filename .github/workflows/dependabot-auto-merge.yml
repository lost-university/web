name: Dependabot auto-merge
on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions: {}

jobs:
  merge:
    # only GitHub Actions updates, and only after CI passed on the PR
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/github_actions/')
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      # merged with the App token so the push to main starts CI and creates a release;
      # --admin because gh refuses locally while a review is required (the App may bypass it), required checks still apply
      - name: Merge PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: gh pr merge "$BRANCH" --merge --admin --match-head-commit "$SHA"
