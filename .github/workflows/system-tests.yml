name: System tests
on:
  workflow_dispatch:
    inputs:
      backendVersion:
        description: 'Backend version'
        required: true
  # called by ci.yml before a web release is deployed
  workflow_call:
    inputs:
      backendVersion:
        type: string
        required: true
  # sent by the backend CI for every backend release, which is deployed if the tests pass
  repository_dispatch:
    types:
      - backend-release

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.set-docker-tag.outputs.repo }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup buildx
        uses: docker/setup-buildx-action@v4
      - name: Set Docker tag
        id: set-docker-tag
        env:
          REPOSITORY: '${{ github.repository }}'
        run: |
          echo "repo=ghcr.io/${REPOSITORY,,}:local-system-tests" >> $GITHUB_OUTPUT
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          push: false
          tags: ${{ steps.set-docker-tag.outputs.repo }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  system-tests:
    needs: build-frontend
    runs-on: ubuntu-latest
    env:
      BACKEND_VERSION: ${{ inputs.backendVersion || github.event.client_payload.version }}
      POSTGRES_HOST: postgres-db
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: postgres
      AUTHORIZED_PARTIES: http://localhost,http://localhost:5173,http://localhost:8080
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
    strategy:
      fail-fast: false
      matrix:
        browser: [ chrome, firefox, edge ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup buildx
        uses: docker/setup-buildx-action@v4
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          push: false
          tags: ${{ needs.build-frontend.outputs.tags }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start Docker containers
        run: |
          docker compose -f cypress/docker-compose.yml up -d
      - name: Setup Firefox
        if: matrix.browser == 'firefox'
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: "140.0"
      - name: Cypress run
        uses: cypress-io/github-action@v7
        with:
          browser: ${{ matrix.browser }}
          headed: true
          wait-on: "http://localhost"
        env:
          CYPRESS_BASE_URL: "http://localhost"
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
      - name: Show Docker Compose logs in output
        if: always()
        run: |
         echo "========= DOCKER COMPOSE LOGS ========="
         docker compose -f cypress/docker-compose.yml logs --no-color
         echo "========= END OF LOGS ========="
      - name: Upload Cypress Screenshots
        uses: actions/upload-artifact@v7
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
        with:
          name: cypress-screenshots-${{ matrix.browser }}
          path: cypress/screenshots/
          retention-days: 90

  deploy-backend:
    needs: system-tests
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-backend
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: backend
      - name: Checkout backend
        uses: actions/checkout@v7
        with:
          repository: lost-university/backend
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          path: backend
      - name: Deploy backend
        working-directory: backend
        env:
          VERSION: ${{ github.event.client_payload.version }}
        run: ../.github/scripts/deploy.sh ghcr.io/lost-university/backend "$VERSION"
