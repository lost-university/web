name: CI
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# runs on main are queued instead of running in parallel, so releases and deploys happen in merge order
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint
  build:
    runs-on: ubuntu-latest
    needs: lint
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=long
      - name: Setup buildx
        uses: docker/setup-buildx-action@v4
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [ chrome, firefox, edge ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup buildx
        uses: docker/setup-buildx-action@v4
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          push: false
          tags: ${{ needs.build.outputs.tags }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run Docker container
        env:
          REPOSITORY: '${{ github.repository }}'
        run: |
          docker run -d -p 5173:80 ghcr.io/${REPOSITORY,,}:sha-${{ github.sha }}
      - name: Setup Firefox
        if: matrix.browser == 'firefox'
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: "140.0"
      - name: Cypress run
        uses: cypress-io/github-action@v7
        with:
          browser: ${{ matrix.browser }}
          wait-on: 'http://localhost:5173'
          component: true
      - name: Upload Cypress Screenshots
        uses: actions/upload-artifact@v7
        with:
          name: cypress-screenshots-${{ matrix.browser }}
          path: cypress/screenshots/
          retention-days: 7

  release:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Create release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          last=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
          if [ -z "$last" ]; then next=1.0.0; else next="${last%.*}.$(( ${last##*.} + 1 ))"; fi
          gh release create "$next" --target "$GITHUB_SHA" --title "$next" --generate-notes
          echo "tag=$next" >> "$GITHUB_OUTPUT"

  publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.release.outputs.tag }}
            type=ref,event=branch
            type=sha,format=long
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and Push Docker image
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  backend-version:
    needs: release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pinned.outputs.version }}
    steps:
      - name: Read the deployed backend version
        id: pinned
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(gh api repos/lost-university/backend/contents/deployment/kustomization.yaml -H 'Accept: application/vnd.github.raw' \
            | yq '.images[] | select(.name == "ghcr.io/lost-university/backend") | .newTag')
          echo "version=$version" >> "$GITHUB_OUTPUT"

  system-tests:
    needs: backend-version
    uses: ./.github/workflows/system-tests.yml
    with:
      backendVersion: ${{ needs.backend-version.outputs.version }}
    secrets: inherit

  deploy:
    needs: [release, publish, system-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: backend
      - name: Checkout backend
        uses: actions/checkout@v7
        with:
          repository: lost-university/backend
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          path: backend
      - name: Deploy web
        working-directory: backend
        env:
          VERSION: ${{ needs.release.outputs.tag }}
        run: ../.github/scripts/deploy.sh ghcr.io/lost-university/web "$VERSION"
